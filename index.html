<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The tab icon is her leaf, not a template graphic. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#10231c" />
    <title>Gladchemistry | Feliz be Glad &amp; Bubbles Detergents</title>
    <meta name="description" content="Household, personal care and pet care made in Springs, Gauteng. Gladchemistry, Feliz be Glad and Bubbles Detergents — shop the range and order on WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gladchemistry" />
    <meta property="og:title" content="Gladchemistry — Feliz be Glad &amp; Bubbles Detergents" />
    <meta property="og:description" content="Three houses, one shelf. Household, personal care and pet care made in Springs, Gauteng." />
    <meta property="og:image" content="/images/hero-sweep-gladchemistry.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the two faces the first screen actually paints, then load the
         stylesheet without blocking the first render: `media="print"` makes the
         browser fetch it off the critical path, and `onload` flips it to screen.
         Two Google families over a slow mobile link were holding up the hero
         behind a render-blocking request. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 antialiased selection:bg-emerald-500/20 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
